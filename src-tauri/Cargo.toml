[package]
name = "getwinusb"
version = "0.1.3"
description = "Nhận diện USB, phân tích phần cứng và tạo USB cài Windows phù hợp"
authors = ["MrBeoHP"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "getwinusb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "gzip", "charset", "http2"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
